version: '3.8'

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: docker.io/postgres:16-alpine
    environment:
      POSTGRES_USER: betuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-not-a-real-dev-password}
      POSTGRES_DB: betting_platform
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betuser -d betting_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging
    networks:
      - betnet

  redis:
    image: docker.io/redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging
    networks:
      - betnet

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      BET_DATABASE_URL: postgresql+asyncpg://betuser:${POSTGRES_PASSWORD:-not-a-real-dev-password}@postgres:5432/betting_platform
      BET_JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      BET_CORS_ORIGINS: http://localhost:5174,http://127.0.0.1:5174,http://localhost:8080,http://127.0.0.1:8080
      BET_COOKIE_SECURE: "false"
      BET_DEBUG: "false"
      BET_TASK_QUEUE_BACKEND: taskiq
      BET_REDIS_URL: redis://redis:6379/0
      BET_TASKIQ_RESULT_BACKEND_URL: redis://redis:6379/1
      BET_TASKIQ_QUEUE_NAME: bet
      BET_TASKIQ_CONSUMER_GROUP: bet-workers
      BET_TASKIQ_WORKER_LANE: control
      BET_TASKIQ_ENABLED_LANES: control,provider-http,provider-browser,model-cpu
      BET_SCHEDULED_JOBS_ENABLED: "false"
      BET_SCRAPE_PIPELINE_V2_PERCENT: ${BET_SCRAPE_PIPELINE_V2_PERCENT:-0}
      BET_TRADING_ENABLED: "true"
      BET_TRADING_PAPER_ENABLED: "true"
      BET_TRADING_LIVE_ENABLED: "false"
      BET_TRADING_BETFAIR_READ_ONLY_ENABLED: "false"
      BET_TRADING_TASKIQ_QUEUE_NAME: bet-trading
      BET_FLUMINE_ROOT: /workspace/flumine
      BET_ODDSHARVESTER_PYTHON: /workspace/OddsHarvester/.venv/bin/python
      BET_PENALTYBLOG_PYTHON: /workspace/penaltyblog/.venv/bin/python
      BET_PENALTYBLOG_BRIDGE: /app/app/bridges/penaltyblog_bridge.py
      BET_PENALTYBLOG_ROOT: /workspace/penaltyblog
      BET_MODEL_ARTIFACT_ROOT: /model-artifacts
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      BET_SOCCERDATA_PYTHON: /workspace/soccerdata/.venv/bin/python
      BET_SOCCERDATA_BRIDGE: /app/app/bridges/soccerdata_bridge.py
      BET_SOCCERDATA_ROOT: /workspace/soccerdata
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./OddsHarvester:/workspace/OddsHarvester:ro
      - ./penaltyblog:/workspace/penaltyblog:ro
      - model_artifacts:/model-artifacts:ro
      - ./soccerdata:/workspace/soccerdata:ro
      - ./flumine:/workspace/flumine:ro
    depends_on:
      model-artifacts-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - betnet

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      BET_DATABASE_URL: postgresql+asyncpg://betuser:${POSTGRES_PASSWORD:-not-a-real-dev-password}@postgres:5432/betting_platform
      BET_JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      BET_TASK_QUEUE_BACKEND: taskiq
      BET_REDIS_URL: redis://redis:6379/0
      BET_TASKIQ_RESULT_BACKEND_URL: redis://redis:6379/1
      BET_TASKIQ_QUEUE_NAME: bet
      BET_TASKIQ_CONSUMER_GROUP: bet-workers
      BET_TASKIQ_WORKER_LANE: control
      BET_TASKIQ_ENABLED_LANES: control,provider-http,provider-browser,model-cpu
      BET_SCRAPE_PIPELINE_V2_PERCENT: ${BET_SCRAPE_PIPELINE_V2_PERCENT:-0}
      BET_TRADING_ENABLED: "true"
      BET_TRADING_PAPER_ENABLED: "true"
      BET_TRADING_LIVE_ENABLED: "false"
      BET_TRADING_BETFAIR_READ_ONLY_ENABLED: "false"
      BET_TRADING_TASKIQ_QUEUE_NAME: bet-trading
      BET_FLUMINE_ROOT: /workspace/flumine
      BET_ODDSHARVESTER_PYTHON: /workspace/OddsHarvester/.venv/bin/python
      BET_PENALTYBLOG_PYTHON: /workspace/penaltyblog/.venv/bin/python
      BET_PENALTYBLOG_BRIDGE: /app/app/bridges/penaltyblog_bridge.py
      BET_PENALTYBLOG_ROOT: /workspace/penaltyblog
      BET_MODEL_ARTIFACT_ROOT: /model-artifacts
      BET_SOCCERDATA_PYTHON: /workspace/soccerdata/.venv/bin/python
      BET_SOCCERDATA_BRIDGE: /app/app/bridges/soccerdata_bridge.py
      BET_SOCCERDATA_ROOT: /workspace/soccerdata
    volumes:
      - ./OddsHarvester:/workspace/OddsHarvester:ro
      - ./penaltyblog:/workspace/penaltyblog:ro
      - model_artifacts:/model-artifacts
      - ./soccerdata:/workspace/soccerdata:ro
      - ./flumine:/workspace/flumine:ro
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Compatibility service name retained; this is the control/default lane.
    command: taskiq worker app.tasks.broker:broker app.tasks.jobs --workers 1 --max-async-tasks 2 --max-prefetch 2 --log-level WARNING
    healthcheck:
      test: ["CMD", "python", "-m", "app.tasks.runtime", "worker:control"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - betnet

  provider-http-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      BET_DATABASE_URL: postgresql+asyncpg://betuser:${POSTGRES_PASSWORD:-not-a-real-dev-password}@postgres:5432/betting_platform
      BET_JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      BET_TASK_QUEUE_BACKEND: taskiq
      BET_REDIS_URL: redis://redis:6379/0
      BET_TASKIQ_RESULT_BACKEND_URL: redis://redis:6379/1
      BET_TASKIQ_QUEUE_NAME: bet
      BET_TASKIQ_CONSUMER_GROUP: bet-workers
      BET_TASKIQ_WORKER_LANE: provider-http
      BET_TASKIQ_ENABLED_LANES: control,provider-http,provider-browser,model-cpu
      BET_TASKIQ_PROVIDER_HTTP_QUEUE_NAME: bet-provider-http
      BET_TASKIQ_PROVIDER_HTTP_CONSUMER_GROUP: bet-provider-http-workers
      BET_SOCCERDATA_PYTHON: /workspace/soccerdata/.venv/bin/python
      BET_SOCCERDATA_BRIDGE: /app/app/bridges/soccerdata_bridge.py
      BET_SOCCERDATA_ROOT: /workspace/soccerdata
    volumes:
      - ./soccerdata:/workspace/soccerdata:ro
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: taskiq worker app.tasks.broker:broker app.tasks.jobs --workers 1 --max-async-tasks 4 --max-prefetch 4 --log-level WARNING
    healthcheck:
      test: ["CMD", "python", "-m", "app.tasks.runtime", "worker:provider-http"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - betnet

  provider-browser-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      BET_DATABASE_URL: postgresql+asyncpg://betuser:${POSTGRES_PASSWORD:-not-a-real-dev-password}@postgres:5432/betting_platform
      BET_JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      BET_TASK_QUEUE_BACKEND: taskiq
      BET_REDIS_URL: redis://redis:6379/0
      BET_TASKIQ_RESULT_BACKEND_URL: redis://redis:6379/1
      BET_TASKIQ_QUEUE_NAME: bet
      BET_TASKIQ_CONSUMER_GROUP: bet-workers
      BET_TASKIQ_WORKER_LANE: provider-browser
      BET_TASKIQ_ENABLED_LANES: control,provider-http,provider-browser,model-cpu
      BET_TASKIQ_PROVIDER_BROWSER_QUEUE_NAME: bet-provider-browser
      BET_TASKIQ_PROVIDER_BROWSER_CONSUMER_GROUP: bet-provider-browser-workers
      BET_ODDSHARVESTER_PYTHON: /workspace/OddsHarvester/.venv/bin/python
      BET_SOCCERDATA_PYTHON: /workspace/soccerdata/.venv/bin/python
      BET_SOCCERDATA_BRIDGE: /app/app/bridges/soccerdata_bridge.py
      BET_SOCCERDATA_ROOT: /workspace/soccerdata
    volumes:
      - ./OddsHarvester:/workspace/OddsHarvester:ro
      - ./soccerdata:/workspace/soccerdata:ro
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: taskiq worker app.tasks.broker:broker app.tasks.jobs --workers 1 --max-async-tasks 1 --max-prefetch 1 --log-level WARNING
    healthcheck:
      test: ["CMD", "python", "-m", "app.tasks.runtime", "worker:provider-browser"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - betnet

  model-cpu-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.production
    environment:
      BET_DATABASE_URL: postgresql+asyncpg://betuser:${POSTGRES_PASSWORD:-not-a-real-dev-password}@postgres:5432/betting_platform
      BET_JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      BET_TASK_QUEUE_BACKEND: taskiq
      BET_REDIS_URL: redis://redis:6379/0
      BET_TASKIQ_RESULT_BACKEND_URL: redis://redis:6379/1
      BET_TASKIQ_QUEUE_NAME: bet
      BET_TASKIQ_CONSUMER_GROUP: bet-workers
      BET_TASKIQ_WORKER_LANE: model-cpu
      BET_TASKIQ_ENABLED_LANES: control,provider-http,provider-browser,model-cpu
      BET_TASKIQ_MODEL_CPU_QUEUE_NAME: bet-model-cpu
      BET_TASKIQ_MODEL_CPU_CONSUMER_GROUP: bet-model-cpu-workers
      BET_PENALTYBLOG_PYTHON: /usr/local/bin/python
      BET_PENALTYBLOG_BRIDGE: /app/backend/app/bridges/penaltyblog_bridge.py
      BET_PENALTYBLOG_ROOT: /app/penaltyblog
      BET_MODEL_ARTIFACT_ROOT: /model-artifacts
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    volumes:
      - ./penaltyblog:/app/penaltyblog:ro
      - model_artifacts:/model-artifacts
    depends_on:
      model-artifacts-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: taskiq worker app.tasks.broker:broker app.tasks.jobs --workers 1 --max-async-tasks 1 --max-prefetch 1 --log-level WARNING
    healthcheck:
      test: ["CMD", "python", "-m", "app.tasks.runtime", "worker:model-cpu"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - betnet

  model-artifacts-init:
    build:
      context: ./backend
      dockerfile: Dockerfile
    user: "0:0"
    command: ["sh", "-ec", "mkdir -p /model-artifacts && chown -R 1001:1001 /model-artifacts"]
    volumes:
      - model_artifacts:/model-artifacts
    restart: "no"
    logging: *default-logging
    networks:
      - betnet

  trading-runner:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      BET_DATABASE_URL: postgresql+asyncpg://betuser:${POSTGRES_PASSWORD:-not-a-real-dev-password}@postgres:5432/betting_platform
      BET_JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      BET_TASK_QUEUE_BACKEND: taskiq
      BET_REDIS_URL: redis://redis:6379/0
      BET_TASKIQ_RESULT_BACKEND_URL: redis://redis:6379/1
      BET_TRADING_ENABLED: "true"
      BET_TRADING_PAPER_ENABLED: "true"
      BET_TRADING_LIVE_ENABLED: "false"
      BET_TRADING_BETFAIR_READ_ONLY_ENABLED: "false"
      BET_TRADING_TASKIQ_QUEUE_NAME: bet-trading
      BET_FLUMINE_ROOT: /workspace/flumine
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./flumine:/workspace/flumine:ro
    command: taskiq worker app.tasks.trading_broker:trading_broker app.tasks.trading
    restart: unless-stopped
    logging: *default-logging
    networks:
      - betnet

  backend-scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      BET_DATABASE_URL: postgresql+asyncpg://betuser:${POSTGRES_PASSWORD:-not-a-real-dev-password}@postgres:5432/betting_platform
      BET_JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      BET_TASK_QUEUE_BACKEND: taskiq
      BET_REDIS_URL: redis://redis:6379/0
      BET_TASKIQ_RESULT_BACKEND_URL: redis://redis:6379/1
      BET_TASKIQ_QUEUE_NAME: bet
      BET_TASKIQ_CONSUMER_GROUP: bet-workers
      BET_TASKIQ_ENABLED_LANES: control,provider-http,provider-browser,model-cpu
      BET_TASKIQ_POLL_INTERVAL_SECONDS: 60
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m app.tasks.scheduler
    healthcheck:
      test: ["CMD", "python", "-m", "app.tasks.runtime", "scheduler"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - betnet

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PUBLIC_API_URL: ""
    environment:
      PUBLIC_API_URL: ""
      BET_API_URL: "http://backend:8000"
    ports:
      - "127.0.0.1:5174:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok && r.status !== 302) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - betnet

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - betnet

networks:
  betnet:
    driver: bridge

volumes:
  pgdata:
  model_artifacts:
