name: Release Build and Evidence

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Configure portable bridge runtime
        run: echo "BET_ODDSHARVESTER_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install backend and OddsHarvester bridge runtime
        working-directory: backend
        run: python -m pip install -e '.[dev]' -e ../OddsHarvester
      - name: Verify portable bridge runtime
        run: python -c 'import oddsharvester'
      - name: Verify combined production Python lock
        run: |
          python -m pip install uv==0.11.25
          cp backend/requirements-production.lock /tmp/requirements-production.lock
          uv pip compile \
            --python-version 3.12 \
            --no-emit-index-url \
            --no-annotate \
            --custom-compile-command \
              'uv pip compile backend/requirements-production.in --python-version 3.12' \
            --output-file /tmp/requirements-production.lock \
            backend/requirements-production.in
          diff -u backend/requirements-production.lock /tmp/requirements-production.lock
      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install chromium --with-deps
      - name: Verify database schema
        working-directory: backend
        env:
          BET_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/bet
        run: |
          alembic upgrade head
          alembic check
      - name: Backend static and test gates
        working-directory: backend
        run: |
          ruff check .
          python -m pytest -q -p no:cacheprovider
      - name: Verify real Redis Taskiq worker and scheduler
        working-directory: backend
        env:
          BET_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/bet
          BET_TASK_QUEUE_BACKEND: taskiq
          BET_REDIS_URL: redis://127.0.0.1:6379/0
          BET_TASKIQ_RESULT_BACKEND_URL: redis://127.0.0.1:6379/1
          BET_TASKIQ_POLL_INTERVAL_SECONDS: 60
        run: |
          set -euo pipefail
          BET_TASKIQ_WORKER_LANE=control taskiq worker app.tasks.broker:broker app.tasks.jobs \
            --workers 1 --max-async-tasks 2 --max-prefetch 2 --log-level WARNING \
            > /tmp/bet-taskiq-control.log 2>&1 &
          control_pid=$!
          BET_TASKIQ_WORKER_LANE=provider-http taskiq worker app.tasks.broker:broker app.tasks.jobs \
            --workers 1 --max-async-tasks 4 --max-prefetch 4 --log-level WARNING \
            > /tmp/bet-taskiq-provider-http.log 2>&1 &
          http_pid=$!
          BET_TASKIQ_WORKER_LANE=provider-browser taskiq worker app.tasks.broker:broker app.tasks.jobs \
            --workers 1 --max-async-tasks 1 --max-prefetch 1 --log-level WARNING \
            > /tmp/bet-taskiq-provider-browser.log 2>&1 &
          browser_pid=$!
          BET_TASKIQ_WORKER_LANE=model-cpu taskiq worker app.tasks.broker:broker app.tasks.jobs \
            --workers 1 --max-async-tasks 1 --max-prefetch 1 --log-level WARNING \
            > /tmp/bet-taskiq-model-cpu.log 2>&1 &
          model_pid=$!
          python -m app.tasks.scheduler > /tmp/bet-taskiq-scheduler.log 2>&1 &
          scheduler_pid=$!
          cleanup() {
            kill "$control_pid" "$http_pid" "$browser_pid" "$model_pid" "$scheduler_pid" >/dev/null 2>&1 || true
            wait "$control_pid" "$http_pid" "$browser_pid" "$model_pid" "$scheduler_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if python -m app.tasks.runtime worker:control >/dev/null 2>&1 \
              && python -m app.tasks.runtime worker:provider-http >/dev/null 2>&1 \
              && python -m app.tasks.runtime worker:provider-browser >/dev/null 2>&1 \
              && python -m app.tasks.runtime worker:model-cpu >/dev/null 2>&1 \
              && python -m app.tasks.runtime scheduler >/dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$control_pid" "$http_pid" "$browser_pid" "$model_pid" "$scheduler_pid" >/dev/null 2>&1; then
              cat /tmp/bet-taskiq-control.log
              cat /tmp/bet-taskiq-provider-http.log
              cat /tmp/bet-taskiq-provider-browser.log
              cat /tmp/bet-taskiq-model-cpu.log
              cat /tmp/bet-taskiq-scheduler.log
              exit 1
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/bet-taskiq-control.log
              cat /tmp/bet-taskiq-provider-http.log
              cat /tmp/bet-taskiq-provider-browser.log
              cat /tmp/bet-taskiq-model-cpu.log
              cat /tmp/bet-taskiq-scheduler.log
              exit 1
            fi
            sleep 1
          done
          python -m app.tasks.smoke
          cleanup
          trap - EXIT
      - name: Frontend static, unit, and build gates
        working-directory: frontend
        run: |
          pnpm check
          pnpm test:unit
          pnpm check:e2e
          pnpm build
      - name: Full Chromium hybrid gate
        working-directory: frontend
        env:
          BET_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/bet
          BET_TASK_QUEUE_BACKEND: inprocess
          BET_REDIS_URL: redis://127.0.0.1:6379/0
        run: pnpm exec playwright test --project=chromium-hybrid --retries=0

  build-scan-and-package:
    needs: verify-source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The production backend image includes the bridge projects.
          submodules: recursive
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Validate production release template with non-secret dummy inputs
        shell: bash
        run: |
          cp deploy/production/.env.example /tmp/bet-production.env
          sed -i 's|__SECRET_FROM_MANAGER__|ci-dummy-non-secret-value|g' /tmp/bet-production.env
          scripts/release/render.sh /tmp/bet-production.env
      - name: Build immutable-candidate images locally
        run: |
          source_label="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          docker build \
            --label "org.opencontainers.image.source=$source_label" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -f backend/Dockerfile.production -t bet-api:${{ github.sha }} .
          docker build \
            --label "org.opencontainers.image.source=$source_label" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t bet-frontend:${{ github.sha }} frontend
          docker build \
            --label "org.opencontainers.image.source=$source_label" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -f nginx/Dockerfile.production -t bet-nginx:${{ github.sha }} .

      - name: Smoke built production images
        shell: bash
        run: |
          set -euo pipefail

          test "$(docker run --rm --entrypoint id bet-api:${{ github.sha }} -u)" != "0"
          docker run --rm --entrypoint dpkg bet-api:${{ github.sha }} --audit
          docker run --rm --entrypoint sh bet-api:${{ github.sha }} -lc \
            '! command -v uv && ! command -v uvx && ! python -m pip show uv >/dev/null 2>&1'
          docker run --rm --entrypoint python bet-api:${{ github.sha }} -c '
          import os
          from pathlib import Path

          import asyncpg
          import camoufox
          import oddsharvester
          import penaltyblog
          import soccerdata
          from app.main import app
          from playwright.sync_api import sync_playwright

          assert app
          assert asyncpg and camoufox and oddsharvester and penaltyblog and soccerdata
          assert os.environ["PLAYWRIGHT_BROWSERS_PATH"] == "/ms-playwright"
          assert os.environ["HOME"] == "/home/appuser"
          home = Path.home()
          assert home == Path("/home/appuser")
          home_probe = home / ".bet-runtime-smoke"
          home_probe.write_text("ok")
          home_probe.unlink()
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch()
              browser.close()
          from camoufox.addons import DefaultAddons
          from camoufox.sync_api import Camoufox
          with Camoufox(headless=True, exclude_addons=[DefaultAddons.UBO]) as browser:
              page = browser.new_page()
              page.set_content("<title>camoufox-smoke</title>")
              assert page.title() == "camoufox-smoke"
          '

          test "$(docker run --rm --entrypoint id bet-frontend:${{ github.sha }} -u)" != "0"
          frontend_id="$(
            docker run --detach --publish 127.0.0.1:3300:3000 \
              bet-frontend:${{ github.sha }}
          )"
          trap 'docker rm --force "$frontend_id" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location \
              http://127.0.0.1:3300/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs "$frontend_id"
              exit 1
            fi
            sleep 1
          done
          docker rm --force "$frontend_id" >/dev/null
          trap - EXIT

          test "$(docker run --rm --entrypoint id bet-nginx:${{ github.sha }} -u)" != "0"
          tls_dir="$(mktemp --directory)"
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$tls_dir/tls.key" \
            -out "$tls_dir/tls.crt" \
            -days 1 \
            -subj "/CN=localhost"
          chmod 0750 "$tls_dir"
          chmod 0640 "$tls_dir/tls.key"
          chmod 0644 "$tls_dir/tls.crt"
          sudo chown -R 101:101 "$tls_dir"
          nginx_id="$(
            docker run --detach \
              --add-host api:127.0.0.1 \
              --add-host frontend:127.0.0.1 \
              --publish 127.0.0.1:38080:8080 \
              --publish 127.0.0.1:38443:8443 \
              --volume "$tls_dir:/etc/nginx/tls:ro" \
              bet-nginx:${{ github.sha }}
          )"
          trap 'docker rm --force "$nginx_id" >/dev/null 2>&1 || true; sudo rm -rf "$tls_dir"' EXIT
          for attempt in $(seq 1 30); do
            if [ "$(curl --silent --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:38080/)" = "308" ]; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs "$nginx_id"
              exit 1
            fi
            sleep 1
          done
          test "$(
            curl --insecure --silent --show-error --output /dev/null \
              --write-out '%{http_code}' https://127.0.0.1:38443/
          )" = "502"
          docker rm --force "$nginx_id" >/dev/null
          sudo rm -rf "$tls_dir"
          trap - EXIT

      - name: Prepare release evidence directory
        run: mkdir -p release-evidence

      - name: Record locally built image identities
        run: |
          docker image inspect \
            bet-api:${{ github.sha }} \
            bet-frontend:${{ github.sha }} \
            bet-nginx:${{ github.sha }} \
            > release-evidence/images.json

      - name: Audit backend image vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0 known-safe after GHSA-69fq-xp46-6x23
        with:
          scan-type: image
          image-ref: bet-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          format: json
          output: release-evidence/backend-vulnerabilities.json
          exit-code: '0'
          ignore-unfixed: false
          version: v0.69.3

      - name: Audit frontend image vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0 known-safe after GHSA-69fq-xp46-6x23
        with:
          scan-type: image
          image-ref: bet-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          format: json
          output: release-evidence/frontend-vulnerabilities.json
          exit-code: '0'
          ignore-unfixed: false
          version: v0.69.3

      - name: Audit nginx image vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0 known-safe after GHSA-69fq-xp46-6x23
        with:
          scan-type: image
          image-ref: bet-nginx:${{ github.sha }}
          severity: HIGH,CRITICAL
          format: json
          output: release-evidence/nginx-vulnerabilities.json
          exit-code: '0'
          ignore-unfixed: false
          version: v0.69.3

      - name: Gate fixable High/Critical image vulnerabilities
        if: always()
        run: |
          python scripts/release/gate_trivy_reports.py \
            release-evidence/backend-vulnerabilities.json \
            release-evidence/frontend-vulnerabilities.json \
            release-evidence/nginx-vulnerabilities.json

      - name: Preserve complete vulnerability evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vulnerability-evidence-${{ github.sha }}
          path: release-evidence/*-vulnerabilities.json
          if-no-files-found: error
          retention-days: 30

      - name: Generate backend SBOM
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0 known-safe after GHSA-69fq-xp46-6x23
        with:
          scan-type: image
          image-ref: bet-api:${{ github.sha }}
          format: cyclonedx
          output: release-evidence/backend.cdx.json
          exit-code: '0'
          version: v0.69.3

      - name: Generate frontend SBOM
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0 known-safe after GHSA-69fq-xp46-6x23
        with:
          scan-type: image
          image-ref: bet-frontend:${{ github.sha }}
          format: cyclonedx
          output: release-evidence/frontend.cdx.json
          exit-code: '0'
          version: v0.69.3

      - name: Generate nginx SBOM
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0 known-safe after GHSA-69fq-xp46-6x23
        with:
          scan-type: image
          image-ref: bet-nginx:${{ github.sha }}
          format: cyclonedx
          output: release-evidence/nginx.cdx.json
          exit-code: '0'
          version: v0.69.3

      - name: Scan tracked secrets
        run: python scripts/scan_tracked_secrets.py

      - name: Package release evidence only (no deployment)
        run: |
          cp deploy/production/compose.yml release-evidence/compose.template.yml
          printf 'git_sha=%s\n' '${{ github.sha }}' > release-evidence/build.txt
          printf '%s\n' 'CI built, smoked, audited, and packaged local candidate images. Full High/Critical reports are retained; fixable findings block automatically and unresolved findings require explicit release risk review. Protected tag runs continue to digest-pinned GHCR publication; deployment remains separately approved.' >> release-evidence/build.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: error

      - name: Preserve exact scanned images for protected publication
        if: >-
          github.event_name == 'push' &&
          github.ref_type == 'tag' &&
          startsWith(github.ref_name, 'v')
        run: |
          mkdir -p release-images
          docker save --output release-images/candidates.tar \
            bet-api:${{ github.sha }} \
            bet-frontend:${{ github.sha }} \
            bet-nginx:${{ github.sha }}
          (
            cd release-images
            sha256sum candidates.tar > candidates.tar.sha256
          )
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: >-
          github.event_name == 'push' &&
          github.ref_type == 'tag' &&
          startsWith(github.ref_name, 'v')
        with:
          name: scanned-release-images-${{ github.sha }}
          path: release-images/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish-signed-images:
    needs: build-scan-and-package
    if: >-
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: registry-release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scanned-release-images-${{ github.sha }}
          path: release-images/
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Validate protected release tag and load scanned images
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            printf 'Invalid release tag: %s\n' "$GITHUB_REF_NAME" >&2
            exit 1
          }
          (
            cd release-images
            sha256sum --check candidates.tar.sha256
          )
          docker load --input release-images/candidates.tar
      - name: Login to GitHub Container Registry
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Refuse to overwrite existing immutable release references
        shell: bash
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          for name in \
            "ghcr.io/${repository}-api" \
            "ghcr.io/${repository}-frontend" \
            "ghcr.io/${repository}-nginx"; do
            for tag in "sha-${GITHUB_SHA}" "$GITHUB_REF_NAME"; do
              scripts/release/assert-registry-ref-absent.sh "$name:$tag"
            done
          done
      - name: Push exact scanned images and capture registry digests
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"

          publish_one() {
            local local_image=$1
            local image_name=$2
            local output_prefix=$3
            local sha_ref="${image_name}:sha-${GITHUB_SHA}"
            local digest

            docker tag "$local_image" "$sha_ref"
            docker push "$sha_ref"
            digest="$(
              docker buildx imagetools inspect "$sha_ref" \
                --format '{{json .Manifest}}' | jq -r '.digest'
            )"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              printf 'Registry returned an invalid digest for %s: %s\n' \
                "$image_name" "$digest" >&2
              exit 1
            }
            printf '%s_name=%s\n' "$output_prefix" "$image_name" >> "$GITHUB_OUTPUT"
            printf '%s_digest=%s\n' "$output_prefix" "$digest" >> "$GITHUB_OUTPUT"
          }

          publish_one \
            "bet-api:${GITHUB_SHA}" \
            "ghcr.io/${repository}-api" \
            api
          publish_one \
            "bet-frontend:${GITHUB_SHA}" \
            "ghcr.io/${repository}-frontend" \
            frontend
          publish_one \
            "bet-nginx:${GITHUB_SHA}" \
            "ghcr.io/${repository}-nginx" \
            nginx
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign and verify immutable registry digests
        shell: bash
        run: |
          set -euo pipefail
          identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          issuer='https://token.actions.githubusercontent.com'
          refs=(
            '${{ steps.publish.outputs.api_name }}@${{ steps.publish.outputs.api_digest }}'
            '${{ steps.publish.outputs.frontend_name }}@${{ steps.publish.outputs.frontend_digest }}'
            '${{ steps.publish.outputs.nginx_name }}@${{ steps.publish.outputs.nginx_digest }}'
          )
          for ref in "${refs[@]}"; do
            cosign sign --yes "$ref"
            cosign verify "$ref" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "$issuer"
          done
      - name: Attest backend image provenance
        id: attest-api
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ steps.publish.outputs.api_name }}
          subject-digest: ${{ steps.publish.outputs.api_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest frontend image provenance
        id: attest-frontend
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ steps.publish.outputs.frontend_name }}
          subject-digest: ${{ steps.publish.outputs.frontend_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest nginx image provenance
        id: attest-nginx
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ steps.publish.outputs.nginx_name }}
          subject-digest: ${{ steps.publish.outputs.nginx_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Verify GitHub provenance attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          refs=(
            '${{ steps.publish.outputs.api_name }}@${{ steps.publish.outputs.api_digest }}'
            '${{ steps.publish.outputs.frontend_name }}@${{ steps.publish.outputs.frontend_digest }}'
            '${{ steps.publish.outputs.nginx_name }}@${{ steps.publish.outputs.nginx_digest }}'
          )
          for ref in "${refs[@]}"; do
            gh attestation verify "oci://$ref" --repo "$GITHUB_REPOSITORY"
          done
      - name: Promote verified digests to the protected version tag
        shell: bash
        run: |
          set -euo pipefail
          promote_one() {
            local image_name=$1
            local digest=$2
            local version_ref="${image_name}:${GITHUB_REF_NAME}"
            local promoted_digest

            docker buildx imagetools create \
              --prefer-index=false \
              --tag "$version_ref" \
              "${image_name}@${digest}"
            promoted_digest="$(
              docker buildx imagetools inspect "$version_ref" \
                --format '{{json .Manifest}}' | jq -r '.digest'
            )"
            [[ "$promoted_digest" == "$digest" ]] || {
              printf 'Version tag digest mismatch for %s: expected %s, received %s\n' \
                "$image_name" "$digest" "$promoted_digest" >&2
              exit 1
            }
          }

          promote_one \
            '${{ steps.publish.outputs.api_name }}' \
            '${{ steps.publish.outputs.api_digest }}'
          promote_one \
            '${{ steps.publish.outputs.frontend_name }}' \
            '${{ steps.publish.outputs.frontend_digest }}'
          promote_one \
            '${{ steps.publish.outputs.nginx_name }}' \
            '${{ steps.publish.outputs.nginx_digest }}'
      - name: Record signed registry evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p registry-evidence
          jq -n \
            --arg git_sha "$GITHUB_SHA" \
            --arg version "$GITHUB_REF_NAME" \
            --arg identity "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --arg issuer 'https://token.actions.githubusercontent.com' \
            --arg api_name '${{ steps.publish.outputs.api_name }}' \
            --arg api_digest '${{ steps.publish.outputs.api_digest }}' \
            --arg api_attestation '${{ steps.attest-api.outputs.attestation-url }}' \
            --arg frontend_name '${{ steps.publish.outputs.frontend_name }}' \
            --arg frontend_digest '${{ steps.publish.outputs.frontend_digest }}' \
            --arg frontend_attestation '${{ steps.attest-frontend.outputs.attestation-url }}' \
            --arg nginx_name '${{ steps.publish.outputs.nginx_name }}' \
            --arg nginx_digest '${{ steps.publish.outputs.nginx_digest }}' \
            --arg nginx_attestation '${{ steps.attest-nginx.outputs.attestation-url }}' \
            '{
              git_sha: $git_sha,
              version: $version,
              cosign: {identity: $identity, issuer: $issuer},
              images: {
                api: {name: $api_name, digest: $api_digest, attestation: $api_attestation},
                frontend: {
                  name: $frontend_name,
                  digest: $frontend_digest,
                  attestation: $frontend_attestation
                },
                nginx: {
                  name: $nginx_name,
                  digest: $nginx_digest,
                  attestation: $nginx_attestation
                }
              }
            }' > registry-evidence/registry.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-registry-evidence-${{ github.sha }}
          path: registry-evidence/
          if-no-files-found: error
