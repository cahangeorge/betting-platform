name: Backend

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install backend
        run: python -m pip install -e '.[dev]'
      - name: Postgres migration smoke
        env:
          BET_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/bet
        run: alembic upgrade head
      - name: Taskiq Redis import smoke
        env:
          BET_TASK_QUEUE_BACKEND: taskiq
          BET_REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          python - <<'PY'
          from app.tasks.broker import broker
          from app.tasks.jobs import execute_scheduled_job_run_task
          print(type(broker).__name__, execute_scheduled_job_run_task.task_name)
          PY
      - name: Run backend tests
        run: python -m pytest -q
