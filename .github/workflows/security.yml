name: Security

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracked-secret-scan:
    name: Tracked secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan tracked files
        run: python3 scripts/scan_tracked_secrets.py

      - name: Verify release and scanner regression contracts
        run: python3 -m unittest tests/test_production_contract.py tests/test_secret_scanner.py

      - name: Validate GitHub Actions workflows with verified actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive=/tmp/actionlint.tar.gz
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check -
          mkdir /tmp/actionlint
          tar --extract --gzip --file "$archive" --directory /tmp/actionlint
          /tmp/actionlint/actionlint .github/workflows/*.yml

      - name: Filesystem vulnerability, secret, and misconfiguration gate
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0 known-safe after GHSA-69fq-xp46-6x23
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          version: v0.69.3
