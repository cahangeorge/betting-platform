name: Hybrid E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/hybrid-e2e.yml'

jobs:
  hybrid-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e '.[dev]'
      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install chromium --with-deps
      - name: Type-check hybrid specs
        working-directory: frontend
        run: pnpm run check:e2e
      - name: Run hybrid e2e
        working-directory: frontend
        env:
          BET_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/bet
          BET_TASK_QUEUE_BACKEND: inline
          BET_REDIS_URL: redis://127.0.0.1:6379/0
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: .playwright-artifacts/frontend/test-results
