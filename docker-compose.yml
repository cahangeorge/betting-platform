version: '3.8'

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: betuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-betpassword_dev}
      POSTGRES_DB: betting_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betuser -d betting_platform"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      BET_DATABASE_URL: postgresql+asyncpg://betuser:${POSTGRES_PASSWORD:-betpassword_dev}@postgres:5432/betting_platform
      BET_JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      BET_CORS_ORIGINS: http://localhost:5173,http://frontend:3000,http://localhost:3000,http://localhost:8000
      BET_DEBUG: "false"
      BET_TASK_QUEUE_BACKEND: taskiq
      BET_REDIS_URL: redis://redis:6379/0
      BET_TASKIQ_RESULT_BACKEND_URL: redis://redis:6379/1
      BET_TASKIQ_QUEUE_NAME: bet
      BET_TASKIQ_CONSUMER_GROUP: bet-workers
      BET_SCHEDULED_JOBS_ENABLED: "false"
      BET_TRADING_ENABLED: "true"
      BET_TRADING_PAPER_ENABLED: "true"
      BET_TRADING_LIVE_ENABLED: "false"
      BET_TRADING_BETFAIR_READ_ONLY_ENABLED: "false"
      BET_TRADING_TASKIQ_QUEUE_NAME: bet-trading
      BET_FLUMINE_ROOT: /workspace/flumine
      BET_ODDSHARVESTER_PYTHON: /workspace/OddsHarvester/.venv/bin/python
      BET_PENALTYBLOG_PYTHON: /workspace/penaltyblog/.venv/bin/python
      BET_PENALTYBLOG_BRIDGE: /app/app/bridges/penaltyblog_bridge.py
      BET_PENALTYBLOG_ROOT: /workspace/penaltyblog
      BET_SOCCERDATA_PYTHON: /workspace/soccerdata/.venv/bin/python
      BET_SOCCERDATA_BRIDGE: /app/app/bridges/soccerdata_bridge.py
      BET_SOCCERDATA_ROOT: /workspace/soccerdata
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./OddsHarvester:/workspace/OddsHarvester:ro
      - ./penaltyblog:/workspace/penaltyblog:ro
      - ./soccerdata:/workspace/soccerdata:ro
      - ./flumine:/workspace/flumine:ro
      - shared_data:/shared_data
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      BET_DATABASE_URL: postgresql+asyncpg://betuser:${POSTGRES_PASSWORD:-betpassword_dev}@postgres:5432/betting_platform
      BET_JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      BET_TASK_QUEUE_BACKEND: taskiq
      BET_REDIS_URL: redis://redis:6379/0
      BET_TASKIQ_RESULT_BACKEND_URL: redis://redis:6379/1
      BET_TASKIQ_QUEUE_NAME: bet
      BET_TASKIQ_CONSUMER_GROUP: bet-workers
      BET_TRADING_ENABLED: "true"
      BET_TRADING_PAPER_ENABLED: "true"
      BET_TRADING_LIVE_ENABLED: "false"
      BET_TRADING_BETFAIR_READ_ONLY_ENABLED: "false"
      BET_TRADING_TASKIQ_QUEUE_NAME: bet-trading
      BET_FLUMINE_ROOT: /workspace/flumine
      BET_ODDSHARVESTER_PYTHON: /workspace/OddsHarvester/.venv/bin/python
      BET_PENALTYBLOG_PYTHON: /workspace/penaltyblog/.venv/bin/python
      BET_PENALTYBLOG_BRIDGE: /app/app/bridges/penaltyblog_bridge.py
      BET_PENALTYBLOG_ROOT: /workspace/penaltyblog
      BET_SOCCERDATA_PYTHON: /workspace/soccerdata/.venv/bin/python
      BET_SOCCERDATA_BRIDGE: /app/app/bridges/soccerdata_bridge.py
      BET_SOCCERDATA_ROOT: /workspace/soccerdata
      PYTHONPATH: /app
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./OddsHarvester:/workspace/OddsHarvester:ro
      - ./penaltyblog:/workspace/penaltyblog:ro
      - ./soccerdata:/workspace/soccerdata:ro
      - ./flumine:/workspace/flumine:ro
      - shared_data:/shared_data
    command: taskiq worker app.tasks.broker:broker app.tasks.jobs
    restart: unless-stopped
    logging: *default-logging

  trading-runner:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      BET_DATABASE_URL: postgresql+asyncpg://betuser:${POSTGRES_PASSWORD:-betpassword_dev}@postgres:5432/betting_platform
      BET_JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      BET_TASK_QUEUE_BACKEND: taskiq
      BET_REDIS_URL: redis://redis:6379/0
      BET_TASKIQ_RESULT_BACKEND_URL: redis://redis:6379/1
      BET_TRADING_ENABLED: "true"
      BET_TRADING_PAPER_ENABLED: "true"
      BET_TRADING_LIVE_ENABLED: "false"
      BET_TRADING_BETFAIR_READ_ONLY_ENABLED: "false"
      BET_TRADING_TASKIQ_QUEUE_NAME: bet-trading
      BET_FLUMINE_ROOT: /workspace/flumine
      PYTHONPATH: /app
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./flumine:/workspace/flumine:ro
    command: taskiq worker app.tasks.trading_broker:trading_broker app.tasks.trading
    restart: unless-stopped
    logging: *default-logging

  backend-scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      BET_DATABASE_URL: postgresql+asyncpg://betuser:${POSTGRES_PASSWORD:-betpassword_dev}@postgres:5432/betting_platform
      BET_JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      BET_TASK_QUEUE_BACKEND: taskiq
      BET_REDIS_URL: redis://redis:6379/0
      BET_TASKIQ_RESULT_BACKEND_URL: redis://redis:6379/1
      BET_TASKIQ_QUEUE_NAME: bet
      BET_TASKIQ_CONSUMER_GROUP: bet-workers
      BET_TASKIQ_POLL_INTERVAL_SECONDS: 60
      PYTHONPATH: /app
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: python -m app.tasks.jobs
    restart: unless-stopped
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      ORIGIN: ${ORIGIN:-http://localhost:5173}
    ports:
      - "5173:3000"
    depends_on:
      backend:
        condition: service_healthy
    command: node build/index.js
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok && r.status !== 302) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
      backend-worker:
        condition: service_started
      backend-scheduler:
        condition: service_started
      frontend:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - shared_data:/shared_data:ro
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres_data:
  shared_data:
