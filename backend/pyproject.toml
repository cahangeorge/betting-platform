[project]
name = "betting-platform"
version = "0.2.0"
description = "Entry-only live football betting bot"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "redis[hiredis]>=5.0.0",
    "pydantic[email]>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "joblib>=1.4.0",
    "bcrypt>=4.1.0",
    "PyJWT>=2.8.0",
    "aiosqlite>=0.22.1",
    "penaltyblog>=1.11.0",
    "scipy>=1.17.1",
]

[project.scripts]
seed-s5 = "scripts.seed_s5:main"
